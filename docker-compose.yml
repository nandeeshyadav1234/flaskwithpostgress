

services:
  web:
    build: ./app
    container_name: flask_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres_db
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_directory=log"]
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:

